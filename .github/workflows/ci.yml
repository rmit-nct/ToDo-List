name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:cloudflare
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
      - name: Isolated MongoDB integration tests
        run: |
          QA_CLOUDFLARE=1 node scripts/test-server.mjs > /tmp/nct-test-server.log 2>&1 &
          SERVER_PID=$!
          VITE_PID=
          trap 'kill "$SERVER_PID" ${VITE_PID:-} || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3100/api/health > /dev/null; then break; fi
            sleep 2
          done
          npm test
          VITE_API_TARGET=http://localhost:3100 npm run dev:vite --prefix frontend -- --host 127.0.0.1 --port 5173 > /tmp/nct-vite.log 2>&1 &
          VITE_PID=$!
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173 > /dev/null; then break; fi
            sleep 1
          done
          TEST_URL=http://localhost:5173 npx tsx --test --test-name-pattern='unified sign-in persists' tests/account-browser.test.ts
